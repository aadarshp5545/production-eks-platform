apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  annotations:
{{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: ClusterIP

  selector:
    app: {{ .Release.Name }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
